
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot DB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <div class="chat-box" id="chat-box"></div>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="Tulis pesan..." />
      <button onclick="sendMessage()">Kirim</button>
    </div>
    <div class="train-box">
      <h3>Latih Chatbot</h3>
      <input type="text" id="new-question" placeholder="Pertanyaan baru" />
      <input type="text" id="new-answer" placeholder="Jawaban chatbot" />
      <button onclick="trainBot()">Tambah</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
